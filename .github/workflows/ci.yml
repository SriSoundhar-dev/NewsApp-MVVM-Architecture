name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    name: Build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads a ~100MB android-all runtime on first use. Without this the
      # JVM suite pays roughly three extra minutes on every run.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/jacocoTestReport
          retention-days: 7

  instrumentation-test:
    name: Espresso tests
    runs-on: ubuntu-latest
    # Boots an emulator, so it is far slower than the JVM job. Kept separate rather than
    # gating it, so a UI failure is distinguishable at a glance.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espresso-test-reports
          path: app/build/reports/androidTests/connected
          retention-days: 7
