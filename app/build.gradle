plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'kotlin-kapt'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

android {
    namespace 'com.sri.soundhar.newsapp_mvvm_architecture'
    compileSdk 34

    defaultConfig {
        applicationId "com.sri.soundhar.newsapp_mvvm_architecture"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "com.sri.soundhar.newsapp_mvvm_architecture.NewsTestRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    sourceSets {
        // Fixtures shared by the JVM and instrumentation suites, so TestDataFactory is
        // written once rather than duplicated per source set.
        test.java.srcDirs += 'src/sharedTest/java'
        androidTest.java.srcDirs += 'src/sharedTest/java'
    }

    buildTypes {
        debug {
            // Emit coverage data from both suites so jacocoTestReport can merge them.
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // 17 rather than 1.8: the test libraries (mockito-kotlin 5.x, Robolectric 4.13)
        // ship JVM 11+ bytecode, which a 1.8 target cannot inline.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests {
            // Robolectric needs the merged resources/manifest on the unit test classpath.
            includeAndroidResources = true
            // Stubbed android.jar methods return defaults instead of throwing, so plain
            // JVM tests can touch classes that incidentally call into the framework.
            returnDefaultValues = true
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.runtime.android
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.kotlinx.coroutines.android
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Pinned so the app and MockWebServer agree on an OkHttp version. Retrofit 2.9 would
    // otherwise pull 3.14.9, and two OkHttp majors in one process breaks instrumentation.
    implementation libs.okhttp
    // Opens an article in a Custom Tab when its row is tapped.
    implementation libs.androidx.browser
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation "com.google.dagger:dagger:2.51.1"
    kapt "com.google.dagger:dagger-compiler:2.51.1"

    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    // JVM unit tests (src/test)
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.turbine
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.robolectric

    // Instrumented / Espresso tests (src/androidTest)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.espresso.contrib
    androidTestImplementation libs.androidx.espresso.intents
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.okhttp.mockwebserver
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    kaptAndroidTest "com.google.dagger:dagger-compiler:2.51.1"
}

/**
 * One coverage report spanning both suites. The Activity is only reachable from Espresso and
 * the ViewModel only from the JVM tests, so a report over either alone is misleading.
 *
 *   ./gradlew testDebugUnitTest connectedDebugAndroidTest jacocoTestReport
 *
 * Running it alone covers the JVM suite only.
 */
tasks.register('jacocoTestReport', JacocoReport) {
    group = 'verification'
    description = 'Merges unit and instrumentation coverage into a single report.'

    dependsOn 'testDebugUnitTest'
    mustRunAfter 'connectedDebugAndroidTest'

    reports {
        html.required = true
        xml.required = true
    }

    // Generated code the tests are not answerable for.
    def generated = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/Dagger*.*', '**/*_Factory.*', '**/*_MembersInjector.*',
            '**/*Module_*.*', '**/databinding/**', '**/*Binding.*',
    ]
    def buildDirectory = layout.buildDirectory.get().asFile
    classDirectories.setFrom(files([
            fileTree(dir: "$buildDirectory/tmp/kotlin-classes/debug", excludes: generated),
            fileTree(dir: "$buildDirectory/intermediates/javac/debug/classes", excludes: generated),
    ]))
    sourceDirectories.setFrom(files(['src/main/java']))
    // .exec from the JVM suite, .ec pulled off the device by the instrumentation suite.
    executionData.setFrom(fileTree(dir: buildDirectory, includes: ['**/*.exec', '**/*.ec']))
}
